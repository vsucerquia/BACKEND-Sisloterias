# Pipeline examen 2: solo rama dev (no qa/prod).
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sisloterias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sisloterias_test
      SECRET_KEY: ci-jwt-secret-change-me-32chars-min!!
      SEED_ADMIN_USER: admin
      SEED_ADMIN_PASSWORD: TestCiPassword123
      CORS_ORIGINS: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: Seeder
        run: python -m scripts.seed

      - name: Pytest
        run: pytest -q
