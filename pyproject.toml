[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

# Tras load_dotenv() / skip condicional hace falta importar app debajo
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
